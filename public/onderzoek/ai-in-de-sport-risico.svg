<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">AI in de sport: hoe risicovol per werkveld?</title>
  <desc id="d">Vijf werkvelden van de sport op een schaal van minimaal tot verboden risico volgens de Europese AI-verordening. Prestatiesport, talentontwikkeling en sportgezondheid lopen van minimaal tot hoog risico, sportmarketing van minimaal tot verboden, en sportevenementen van hoog tot verboden.</desc>

  <rect x="1" y="1" width="958" height="558" rx="18" fill="#ffffff" stroke="#d5dbd2"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f1720">AI in de sport: hoe risicovol per werkveld?</text>
  <text x="40" y="78" font-size="14" fill="#525c6a">Indeling volgens de Europese AI-verordening. De balk toont de bandbreedte: het risico hangt af van het gebruik.</text>

  <rect x="270" y="100" width="165" height="420" fill="#f1f3f2"/>
  <rect x="435" y="100" width="165" height="420" fill="#e5f4f8"/>
  <rect x="600" y="100" width="165" height="420" fill="#fcefe3"/>
  <rect x="765" y="100" width="165" height="420" fill="#fbe9ec"/>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="352" y="124" fill="#525c6a">MINIMAAL</text>
    <text x="517" y="124" fill="#0b6a85">BEPERKT</text>
    <text x="682" y="124" fill="#a3480a">HOOG</text>
    <text x="847" y="124" fill="#be123c">VERBODEN</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#525c6a">
    <text x="352" y="140">geen extra eisen</text>
    <text x="517" y="140">transparantie (art. 50)</text>
    <text x="682" y="140">strenge eisen (bijlage I/III)</text>
    <text x="847" y="140">art. 5</text>
  </g>

  <g stroke="#d5dbd2">
    <line x1="30" y1="152" x2="930" y2="152"/>
    <line x1="30" y1="226" x2="930" y2="226"/>
    <line x1="30" y1="300" x2="930" y2="300"/>
    <line x1="30" y1="374" x2="930" y2="374"/>
    <line x1="30" y1="448" x2="930" y2="448"/>
  </g>

  <g>
    <text x="40" y="180" font-size="16" font-weight="700" fill="#0f1720">Prestatiesport &amp; coaching</text>
    <text x="40" y="200" font-size="12.5" fill="#525c6a">Blessurevoorspelling met wearables</text>
    <line x1="352" y1="182" x2="682" y2="182" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="182" r="9" fill="#6b7280" stroke="#fff" stroke-width="2"/>
    <circle cx="682" cy="182" r="9" fill="#c2410c" stroke="#fff" stroke-width="2"/>
    <text x="278" y="212" font-size="12" fill="#334155">Hoog risico zodra het meeweegt in selectie of contract van spelers</text>
  </g>

  <g>
    <text x="40" y="254" font-size="16" font-weight="700" fill="#0f1720">Talentontwikkeling</text>
    <text x="40" y="274" font-size="12.5" fill="#525c6a">AI-selectie van jeugdspelers</text>
    <line x1="352" y1="256" x2="682" y2="256" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="256" r="9" fill="#6b7280" stroke="#fff" stroke-width="2"/>
    <circle cx="682" cy="256" r="9" fill="#c2410c" stroke="#fff" stroke-width="2"/>
    <text x="278" y="286" font-size="12" fill="#334155">Hoog bij toelating tot een opleiding · grootste risico: leeftijdsbias</text>
  </g>

  <g>
    <text x="40" y="328" font-size="16" font-weight="700" fill="#0f1720">Sportgezondheid</text>
    <text x="40" y="348" font-size="12.5" fill="#525c6a">AI-app die blessures beoordeelt</text>
    <line x1="352" y1="330" x2="682" y2="330" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="330" r="9" fill="#6b7280" stroke="#fff" stroke-width="2"/>
    <circle cx="682" cy="330" r="9" fill="#c2410c" stroke="#fff" stroke-width="2"/>
    <text x="278" y="360" font-size="12" fill="#334155">Hoog risico als de app een medisch hulpmiddel is (MDR)</text>
  </g>

  <g>
    <text x="40" y="402" font-size="16" font-weight="700" fill="#0f1720">Sportmarketing</text>
    <text x="40" y="422" font-size="12.5" fill="#525c6a">Personalisatie, chatbots, AI-content</text>
    <line x1="352" y1="404" x2="847" y2="404" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="404" r="9" fill="#6b7280" stroke="#fff" stroke-width="2"/>
    <circle cx="517" cy="404" r="9" fill="#0b6a85" stroke="#fff" stroke-width="2"/>
    <circle cx="847" cy="404" r="9" fill="#be123c" stroke="#fff" stroke-width="2"/>
    <text x="278" y="434" font-size="12" fill="#334155">Chatbots en AI-content: melden dat het AI is · verboden bij uitbuiten van jonge fans</text>
  </g>

  <g>
    <text x="40" y="476" font-size="16" font-weight="700" fill="#0f1720">Sportevenementen</text>
    <text x="40" y="496" font-size="12.5" fill="#525c6a">Gezichtsherkenning bij de ingang</text>
    <line x1="682" y1="478" x2="847" y2="478" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="682" cy="478" r="9" fill="#c2410c" stroke="#fff" stroke-width="2"/>
    <circle cx="847" cy="478" r="9" fill="#be123c" stroke="#fff" stroke-width="2"/>
    <text x="278" y="508" font-size="12" fill="#334155">Biometrie: hoog risico · realtime identificatie door de politie in principe verboden</text>
  </g>

  <text x="40" y="545" font-size="11" fill="#525c6a">Eigen figuur · Mike Schouten · Bronnen: AI-verordening (EU 2024/1689), AVG, UAVG art. 29, MDCG 2019-11</text>
</svg>
